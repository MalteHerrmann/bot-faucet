[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.ci]
deny = "warnings"

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1024
depth = 100
fail_on_revert = true
