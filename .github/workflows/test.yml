name: CI

# No default token permissions. Each job asks for what it needs.
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel older runs of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs. Foundry is pinned to an exact version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      # Foundry 1.9.0 includes Solar 0.3.0. foundry.toml selects it as the compiler.
      - name: Show Forge and Solar versions
        run: |
          forge --version
          solar --version

      # The checks are make targets (see Makefile), the same as a local `make ci-gate`.
      # Each check also runs when an earlier one fails, so the job shows all results.
      - name: Format
        if: ${{ !cancelled() }}
        run: make fmt

      - name: Lint
        if: ${{ !cancelled() }}
        run: make lint

      - name: Build
        if: ${{ !cancelled() }}
        run: make build

      - name: Test
        if: ${{ !cancelled() }}
        run: make test

      - name: Coverage gate
        if: ${{ !cancelled() }}
        run: make coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  # Live deploys use solc bytecode. This job tests it parallel to the Solar tests.
  test-solc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      - name: Test
        run: make test-solc

  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      # Same uv version as mise.toml. The Makefile pins Slither and Python.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Run Slither
        run: make slither
